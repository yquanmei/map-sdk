<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标记点聚合示例</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .map-container {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
      margin: 20px 0;
    }

    .controls {
      margin: 20px 0;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 5px;
    }

    .control-group {
      margin: 10px 0;
    }

    label {
      display: inline-block;
      width: 120px;
      font-weight: bold;
    }

    input,
    select {
      padding: 5px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .example-points {
      margin: 10px 0;
      padding: 10px;
      background: #e9ecef;
      border-radius: 3px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>标记点聚合示例</h1>

    <div class="controls">
      <div class="control-group">
        <label>地图提供者:</label>
        <select id="provider">
          <option value="amap">高德地图</option>
          <option value="google">Google 地图</option>
          <option value="openlayers">OpenLayers</option>
        </select>
      </div>

      <div class="control-group">
        <label>API Key:</label>
        <input type="text" id="apiKey" placeholder="请输入API密钥（可选）">
      </div>

      <div class="control-group">
        <label>聚合距离:</label>
        <input type="number" id="gridSize" value="60" min="10" max="200">
        <span>像素</span>
      </div>

      <div class="control-group">
        <label>最大聚合层级:</label>
        <input type="number" id="maxZoom" value="18" min="10" max="20">
      </div>

      <div class="control-group">
        <label>聚合图标:</label>
        <input type="text" id="clusterIcon"
          value="<div style='background-color: #ff6b6b; color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: bold;'>{count}</div>">
      </div>

      <div class="control-group">
        <button onclick="initMap()">初始化地图</button>
        <button onclick="addCluster()">添加聚合标记点</button>
        <button onclick="clearClusters()">清除聚合</button>
      </div>
    </div>

    <div class="map-container" id="map"></div>

    <div class="example-points">
      <strong>示例坐标点:</strong><br>
      [
      [116.397428, 39.90923],
      [116.407428, 39.91923],
      [116.417428, 39.92923],
      [116.427428, 39.93923],
      [116.437428, 39.94923],
      [116.447428, 39.95923],
      [116.457428, 39.96923],
      [116.467428, 39.97923],
      [116.477428, 39.98923],
      [116.487428, 39.99923]
      ]
    </div>
  </div>

  <script type="module">
    import { MapSDK } from '../src/index.js';

    let mapSDK = null;
    let currentCluster = null;

    // 示例坐标点数据
    const samplePoints = [
      { position: [116.397428, 39.90923] },
      { position: [116.407428, 39.91923] },
      { position: [116.417428, 39.92923] },
      { position: [116.427428, 39.93923] },
      { position: [116.437428, 39.94923] },
      { position: [116.447428, 39.95923] },
      { position: [116.457428, 39.96923] },
      { position: [116.467428, 39.97923] },
      { position: [116.477428, 39.98923] },
      { position: [116.487428, 39.99923] }
    ];

    window.initMap = async function () {
      try {
        const provider = document.getElementById('provider').value;
        const apiKey = document.getElementById('apiKey').value;

        // 创建地图SDK实例
        mapSDK = new MapSDK(provider);

        // 初始化地图
        await mapSDK.init({
          container: 'map',
          center: [116.397428, 39.90923],
          zoom: 12,
          apiKey: apiKey || undefined
        });

        console.log('地图初始化成功');
        alert('地图初始化成功！');

      } catch (error) {
        console.error('地图初始化失败:', error);
        alert('地图初始化失败: ' + error.message);
      }
    };

    window.addCluster = async function () {
      if (!mapSDK) {
        alert('请先初始化地图');
        return;
      }

      try {
        const gridSize = parseInt(document.getElementById('gridSize').value);
        const maxZoom = parseInt(document.getElementById('maxZoom').value);
        const clusterIcon = document.getElementById('clusterIcon').value;

        // 添加聚合标记点
        currentCluster = await mapSDK.addMarkerCluster(samplePoints, {
          gridSize: gridSize,
          maxZoom: maxZoom,
          renderClusterMarker: clusterIcon,
          renderMarker: {
            position: [0, 0], // 占位符
            icon: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png'
          }
        });

        console.log('聚合标记点添加成功:', currentCluster);
        alert('聚合标记点添加成功！');

      } catch (error) {
        console.error('添加聚合标记点失败:', error);
        alert('添加聚合标记点失败: ' + error.message);
      }
    };

    window.clearClusters = function () {
      if (currentCluster) {
        mapSDK.removeMarkerCluster(currentCluster);
        currentCluster = null;
        console.log('聚合标记点已清除');
        alert('聚合标记点已清除！');
      } else {
        alert('没有可清除的聚合标记点');
      }
    };

    // 页面加载完成后自动初始化地图
    window.addEventListener('load', () => {
      console.log('页面加载完成，可以开始使用地图聚合功能');
    });
  </script>
</body>

</html>
