<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map SDK - 基本使用示例</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .map-container {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      margin: 20px 0;
    }

    .controls {
      margin: 20px 0;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .provider-select {
      padding: 10px;
      margin: 10px 0;
      width: 200px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Map SDK - 基本使用示例</h1>

    <div>
      <label for="provider">选择地图服务商:</label>
      <select id="provider" class="provider-select">
        <option value="amap">高德地图</option>
        <option value="google">Google Maps</option>
        <option value="openlayers">OpenLayers</option>
      </select>
    </div>

    <div class="controls">
      <button onclick="initMap()">初始化地图</button>
      <button onclick="addMarker()">添加标记点</button>
      <button onclick="clearMarkers()">清除标记点</button>
      <button onclick="setCenter()">设置中心点</button>
      <button onclick="setZoom()">设置缩放</button>
    </div>

    <div id="map-container" class="map-container"></div>

    <div id="log"></div>
  </div>

  <!-- 引入Google Maps SDK (可选) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>

  <!-- 引入OpenLayers SDK (可选) -->
  <script src="https://cdn.jsdelivr.net/npm/ol@v7.4.0/dist/ol.js"></script>

  <script type="module">
    // 这里需要先构建项目并引入构建后的文件
    // import { MapSDK, MapProvider } from '../dist/index.js';

    let mapSDK = null;
    let currentMarkers = [];

    window.initMap = async function () {
      try {
        const providerSelect = document.getElementById('provider');
        const provider = providerSelect.value;

        // 这里应该根据选择的provider创建相应的MapSDK实例
        // 由于这是示例，我们使用模拟的API
        console.log(`初始化 ${provider} 地图`);

        // 模拟地图初始化
        document.getElementById('log').innerHTML = `<p>✅ 地图初始化成功 (${provider})</p>`;

      } catch (error) {
        console.error('地图初始化失败:', error);
        document.getElementById('log').innerHTML = `<p>❌ 地图初始化失败: ${error.message}</p>`;
      }
    };

    window.addMarker = async function () {
      try {
        // 模拟添加标记点
        const marker = {
          id: `marker_${Date.now()}`,
          position: [116.397428 + Math.random() * 0.01, 39.90923 + Math.random() * 0.01]
        };

        currentMarkers.push(marker);
        console.log('添加标记点:', marker);
        document.getElementById('log').innerHTML += `<p>✅ 添加标记点成功: ${marker.id}</p>`;

      } catch (error) {
        console.error('添加标记点失败:', error);
        document.getElementById('log').innerHTML += `<p>❌ 添加标记点失败: ${error.message}</p>`;
      }
    };

    window.clearMarkers = function () {
      try {
        currentMarkers = [];
        console.log('清除所有标记点');
        document.getElementById('log').innerHTML += `<p>✅ 清除所有标记点成功</p>`;

      } catch (error) {
        console.error('清除标记点失败:', error);
        document.getElementById('log').innerHTML += `<p>❌ 清除标记点失败: ${error.message}</p>`;
      }
    };

    window.setCenter = function () {
      try {
        const newCenter = [116.407428, 39.91923];
        console.log('设置中心点:', newCenter);
        document.getElementById('log').innerHTML += `<p>✅ 设置中心点成功: ${newCenter.join(', ')}</p>`;

      } catch (error) {
        console.error('设置中心点失败:', error);
        document.getElementById('log').innerHTML += `<p>❌ 设置中心点失败: ${error.message}</p>`;
      }
    };

    window.setZoom = function () {
      try {
        const newZoom = 15;
        console.log('设置缩放级别:', newZoom);
        document.getElementById('log').innerHTML += `<p>✅ 设置缩放级别成功: ${newZoom}</p>`;

      } catch (error) {
        console.error('设置缩放级别失败:', error);
        document.getElementById('log').innerHTML += `<p>❌ 设置缩放级别失败: ${error.message}</p>`;
      }
    };
  </script>
</body>

</html>
